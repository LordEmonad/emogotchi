# Redraws the /stats share card (brand/stats-og.png) from the live index once a day, so the EMO-burned number on
# the card keeps up between site deploys. Source of truth: tools/stats-card.yml and tools/og-stats.mjs in the
# emo-pets monorepo; pages-deploy.sh copies them here. Run by hand from the Actions tab (workflow_dispatch).
name: Stats card
on:
  schedule:
    - cron: '23 6 * * *'   # 06:23 UTC daily
  workflow_dispatch:
permissions:
  contents: write
concurrency: stats-card
jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install a browser
        run: npm install --no-save --no-audit --no-fund puppeteer@24
      - name: Draw the card
        run: node .github/stats-card/og-stats.mjs --site . --out brand/stats-og.png
      - name: Commit it if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand/stats-og.png brand/stats-og.txt
          git diff --cached --quiet -- brand/stats-og.txt && echo "the number on the card has not changed" || (git commit -q -m "Stats card: $(cat brand/stats-og.txt) EMO, $(date -u +%F)" && git push -q)
